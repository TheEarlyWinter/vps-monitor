name: Release Hana App

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Check SSH runtime syntax
        run: npm run check:runtime

      - name: Build Hana App bundle
        run: npm run pack:app -- --output dist/vps-monitor-app

      - name: Validate bundle boundary
        run: |
          test -z "$(find dist/vps-monitor-app -type l -print -quit)"
          test -f dist/vps-monitor-app/manifest.json
          test -f dist/vps-monitor-app/node_modules/@hana/app-sdk/package.json
          test -f dist/vps-monitor-app/node_modules/ssh2/package.json
          if find dist/vps-monitor-app -type f \( \
            -name 'M0阶段实施交付与核验报告.md' \
            -o -name '工程落地与阶段核验交付报告.md' \
            -o -name '技术实施规范.md' \
          \) -print -quit | grep -q .; then
            echo 'Internal documents must not be shipped in the Hana App bundle.' >&2
            exit 1
          fi

      - name: Archive bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          archive="vps-monitor-${version}-hana-app.zip"
          (cd dist && zip -qr "$archive" vps-monitor-app)
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          archive="vps-monitor-${version}-hana-app.zip"
          gh release create "$RELEASE_TAG" \
            "dist/$archive" \
            "dist/$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "vps-monitor $RELEASE_TAG" \
            --generate-notes
